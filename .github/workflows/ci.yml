name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy types-redis types-requests

    - name: Lint with ruff
      run: |
        ruff check app/ --output-format=github

    - name: Type check with mypy
      run: |
        mypy app/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # Don't fail CI on type errors initially

  backend-test:
    name: Backend Tests
    needs: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adsoptimizer
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adsoptimizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://adsoptimizer:test_password@localhost:5432/adsoptimizer_test
        REDIS_URL: redis://localhost:6379/0
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-for-ci
        TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
        GOOGLE_ADS_DEVELOPER_TOKEN: test
        GOOGLE_ADS_CLIENT_ID: test
        GOOGLE_ADS_CLIENT_SECRET: test
        OPENAI_API_KEY: test
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing tests/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true

  migration-check:
    name: Alembic Migration Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adsoptimizer
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adsoptimizer_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations up
      env:
        DATABASE_URL: postgresql://adsoptimizer:test_password@localhost:5432/adsoptimizer_migration_test
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-for-ci
        TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
        GOOGLE_ADS_DEVELOPER_TOKEN: test
        GOOGLE_ADS_CLIENT_ID: test
        GOOGLE_ADS_CLIENT_SECRET: test
        OPENAI_API_KEY: test
      run: alembic upgrade head

    - name: Run migrations down
      env:
        DATABASE_URL: postgresql://adsoptimizer:test_password@localhost:5432/adsoptimizer_migration_test
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-for-ci
        TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
        GOOGLE_ADS_DEVELOPER_TOKEN: test
        GOOGLE_ADS_CLIENT_ID: test
        GOOGLE_ADS_CLIENT_SECRET: test
        OPENAI_API_KEY: test
      run: alembic downgrade base

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run type-check
      continue-on-error: true

    - name: Build check
      run: npm run build

  admin-frontend-lint:
    name: Admin Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin-frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: admin-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint
      continue-on-error: true

    - name: Build check
      run: npm run build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: blossomads-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: blossomads-frontend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true  # Frontend Dockerfile might not exist yet
