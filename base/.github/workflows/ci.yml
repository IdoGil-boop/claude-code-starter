<!-- managed by claude-code-starter -->
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./{{BACKEND_DIR}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: {{BACKEND_DIR}}/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff mypy types-redis types-requests

    - name: Lint with ruff
      run: |
        ruff check {{SOURCE_DIR}}/ --output-format=github

    - name: Type check with mypy
      run: |
        mypy {{SOURCE_DIR}}/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # Don't fail CI on type errors initially

  backend-test:
    name: Backend Tests
    needs: backend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./{{BACKEND_DIR}}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: {{PROJECT_NAME}}
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: {{PROJECT_NAME}}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: {{BACKEND_DIR}}/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage
      env:
        DATABASE_URL: postgresql://{{PROJECT_NAME}}:test_password@localhost:5432/{{PROJECT_NAME}}_test
        REDIS_URL: redis://localhost:6379/0
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-for-ci
        TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
      run: |
        {{COVERAGE_CMD}} --cov-report=xml --cov-report=term-missing {{TEST_DIR}}/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./{{BACKEND_DIR}}/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true

  migration-check:
    name: Alembic Migration Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./{{BACKEND_DIR}}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: {{PROJECT_NAME}}
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: {{PROJECT_NAME}}_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: {{BACKEND_DIR}}/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations up
      env:
        DATABASE_URL: postgresql://{{PROJECT_NAME}}:test_password@localhost:5432/{{PROJECT_NAME}}_migration_test
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-for-ci
        TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
      run: alembic upgrade head

    - name: Run migrations down
      env:
        DATABASE_URL: postgresql://{{PROJECT_NAME}}:test_password@localhost:5432/{{PROJECT_NAME}}_migration_test
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-for-ci
        TOKEN_ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
      run: alembic downgrade base

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./{{FRONTEND_DIR}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: {{FRONTEND_DIR}}/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run type-check
      continue-on-error: true

    - name: Build check
      run: npm run build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./{{BACKEND_DIR}}
        file: ./{{BACKEND_DIR}}/Dockerfile
        push: false
        tags: {{PROJECT_NAME}}-backend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./{{FRONTEND_DIR}}
        file: ./{{FRONTEND_DIR}}/Dockerfile
        push: false
        tags: {{PROJECT_NAME}}-frontend:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
      continue-on-error: true  # Frontend Dockerfile might not exist yet
